name: Temporary Common Crawl Zhihu archive search

on:
  push:
    branches:
      - tmp/zhihu-chen-li-20260824
    paths:
      - .github/workflows/tmp-commoncrawl-zhihu.yml

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/zhihu-chen-li-20260824
      - name: Query Common Crawl indexes
        shell: bash
        run: |
          cat > /tmp/cc_search.py <<'PY'
          import json, time, urllib.parse, urllib.request, urllib.error

          indexes = [
              'CC-MAIN-2026-30','CC-MAIN-2026-25','CC-MAIN-2026-21','CC-MAIN-2026-17',
              'CC-MAIN-2026-12','CC-MAIN-2026-08','CC-MAIN-2026-04',
              'CC-MAIN-2025-51','CC-MAIN-2025-47','CC-MAIN-2025-43','CC-MAIN-2025-38',
              'CC-MAIN-2025-33','CC-MAIN-2025-30','CC-MAIN-2025-26','CC-MAIN-2025-21',
              'CC-MAIN-2025-18','CC-MAIN-2025-13','CC-MAIN-2025-08','CC-MAIN-2025-05'
          ]
          targets = [
              ('articles_api','https://www.zhihu.com/api/v4/members/chen-li-29-9/articles','prefix'),
              ('posts','https://www.zhihu.com/people/chen-li-29-9/posts','prefix'),
              ('profile','https://www.zhihu.com/people/chen-li-29-9','exact'),
          ]
          ua = 'Mozilla/5.0 CommonCrawl metadata lookup for research'
          records=[]
          status=[]
          for idx in indexes:
              for label, target, mt in targets:
                  params = {'url':target,'output':'json','matchType':mt,'filter':'status:200'}
                  url = f'https://index.commoncrawl.org/{idx}-index?' + urllib.parse.urlencode(params)
                  req = urllib.request.Request(url, headers={'User-Agent':ua})
                  code=None; text=''
                  for attempt in range(3):
                      try:
                          with urllib.request.urlopen(req, timeout=35) as r:
                              code=r.status; text=r.read().decode('utf-8','replace')
                          break
                      except urllib.error.HTTPError as e:
                          code=e.code; text=e.read().decode('utf-8','replace')
                          if code in (429,503):
                              time.sleep(5*(attempt+1)); continue
                          break
                      except Exception as e:
                          text=f'{type(e).__name__}: {e}'
                          time.sleep(3*(attempt+1))
                  found=0
                  if code == 200:
                      for line in text.splitlines():
                          line=line.strip()
                          if not line: continue
                          try:
                              obj=json.loads(line)
                          except Exception:
                              continue
                          obj['_index']=idx; obj['_target']=label
                          records.append(obj); found += 1
                  status.append({'index':idx,'target':label,'status':code,'found':found,'message':text[:300] if code != 200 else ''})
                  print(idx,label,code,found,flush=True)
                  time.sleep(1.6)
          with open('commoncrawl-records.json','w',encoding='utf-8') as f:
              json.dump({'count':len(records),'records':records},f,ensure_ascii=False,indent=2)
          with open('commoncrawl-status.json','w',encoding='utf-8') as f:
              json.dump(status,f,ensure_ascii=False,indent=2)
          PY
          python /tmp/cc_search.py
      - name: Persist archive index result
        if: always()
        shell: bash
        run: |
          mkdir -p tmp-commoncrawl-result
          rm -f tmp-commoncrawl-result/*
          [ ! -f commoncrawl-records.json ] || cp commoncrawl-records.json tmp-commoncrawl-result/
          [ ! -f commoncrawl-status.json ] || cp commoncrawl-status.json tmp-commoncrawl-result/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp-commoncrawl-result
          if ! git diff --cached --quiet; then
            git commit -m 'chore: persist Common Crawl Zhihu index result [skip ci]'
            git pull --rebase origin tmp/zhihu-chen-li-20260824
            git push origin HEAD:tmp/zhihu-chen-li-20260824
          fi
