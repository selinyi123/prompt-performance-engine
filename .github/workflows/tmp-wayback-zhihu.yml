name: Temporary Wayback Zhihu archive search

on:
  push:
    branches:
      - tmp/zhihu-chen-li-20260824
    paths:
      - .github/workflows/tmp-wayback-zhihu.yml

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/zhihu-chen-li-20260824
      - name: Query Wayback CDX
        shell: bash
        run: |
          cat > /tmp/wayback.py <<'PY'
          import json, urllib.parse, urllib.request, urllib.error, time
          targets = [
            ('articles_api','https://www.zhihu.com/api/v4/members/chen-li-29-9/articles*'),
            ('posts','https://www.zhihu.com/people/chen-li-29-9/posts*'),
            ('profile','https://www.zhihu.com/people/chen-li-29-9'),
          ]
          out=[]; status=[]
          for label,target in targets:
            params={
              'url':target,'output':'json','fl':'timestamp,original,statuscode,mimetype,digest,length',
              'filter':'statuscode:200','from':'20250101','to':'20260819','limit':'5000'
            }
            url='https://web.archive.org/cdx/search/cdx?'+urllib.parse.urlencode(params)
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 archive metadata research'})
            text=''; code=None
            for attempt in range(3):
              try:
                with urllib.request.urlopen(req,timeout=45) as r:
                  code=r.status; text=r.read().decode('utf-8','replace')
                break
              except urllib.error.HTTPError as e:
                code=e.code; text=e.read().decode('utf-8','replace')
                if code in (429,502,503): time.sleep(5*(attempt+1)); continue
                break
              except Exception as e:
                text=f'{type(e).__name__}: {e}'; time.sleep(4*(attempt+1))
            found=0
            if code==200:
              try:
                arr=json.loads(text)
                if arr and len(arr)>1:
                  hdr=arr[0]
                  for row in arr[1:]:
                    obj=dict(zip(hdr,row)); obj['_target']=label; out.append(obj); found+=1
              except Exception as e:
                status.append({'target':label,'status':code,'parse_error':str(e),'prefix':text[:300]})
            status.append({'target':label,'status':code,'found':found,'message':text[:300] if code!=200 else ''})
            print(label,code,found,flush=True)
            time.sleep(3)
          with open('wayback-records.json','w',encoding='utf8') as f: json.dump({'count':len(out),'records':out},f,ensure_ascii=False,indent=2)
          with open('wayback-status.json','w',encoding='utf8') as f: json.dump(status,f,ensure_ascii=False,indent=2)
          PY
          python /tmp/wayback.py
      - name: Persist result
        if: always()
        shell: bash
        run: |
          mkdir -p tmp-wayback-result
          rm -f tmp-wayback-result/*
          [ ! -f wayback-records.json ] || cp wayback-records.json tmp-wayback-result/
          [ ! -f wayback-status.json ] || cp wayback-status.json tmp-wayback-result/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp-wayback-result
          if ! git diff --cached --quiet; then
            git commit -m 'chore: persist Wayback Zhihu index result [skip ci]'
            git pull --rebase origin tmp/zhihu-chen-li-20260824
            git push origin HEAD:tmp/zhihu-chen-li-20260824
          fi
