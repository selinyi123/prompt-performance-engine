name: Temporary Sohu author feed reverse

on:
  push:
    branches:
      - tmp/zhihu-chen-li-20260824
    paths:
      - .github/workflows/tmp-sohu-feed-reverse.yml

permissions:
  contents: write

jobs:
  reverse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/zhihu-chen-li-20260824
      - name: Probe URL pagination and reverse JS
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, re, json, os, html
          BASE='https://m.sohu.com/media/252291'
          UA={'User-Agent':'Mozilla/5.0 (Linux; Android 12) AppleWebKit/537.36 Chrome/128 Mobile Safari/537.36'}

          def fetch(url):
              req=urllib.request.Request(url,headers=UA)
              with urllib.request.urlopen(req,timeout=60) as r:
                  return r.geturl(), r.read().decode('utf-8','replace')

          def first_items(text,n=4):
              # SSR serialized data has title/postTime/id adjacent enough for a broad object regex.
              objs=[]
              for m in re.finditer(r'\{[^{}]{0,6000}?"title":"([^"]+)"[^{}]{0,6000}?"postTime":(\d+)[^{}]{0,6000}?"id":(\d+)[^{}]{0,6000}?"authorId":252291', text):
                  objs.append({'title':html.unescape(m.group(1)),'postTime':int(m.group(2)),'id':int(m.group(3))})
                  if len(objs)>=n: break
              if not objs:
                  # fallback based on visible article links and title divs
                  for m in re.finditer(r'm\.sohu\.com/a/(\d+)_252291[^>]*>.*?<div class="title">(?:<!---->)?([^<]+)</div>',text,re.S):
                      objs.append({'id':int(m.group(1)),'title':html.unescape(m.group(2)).strip()})
                      if len(objs)>=n: break
              return objs

          probes=[]
          variants=[
              BASE,
              BASE+'?page=2',
              BASE+'?page=1',
              BASE+'?offset=20',
              BASE+'?cursor=20',
              BASE+'?p=2',
          ]
          base_html=''
          for url in variants:
              try:
                  final,text=fetch(url)
                  if url==BASE: base_html=text
                  probes.append({'url':url,'final':final,'size':len(text),'first':first_items(text)})
              except Exception as e:
                  probes.append({'url':url,'error':repr(e)})

          # Extract all JS URLs from SSR page, prioritize the main Clientindex bundle.
          scripts=[]
          for src in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',base_html):
              if src.startswith('//'): src='https:'+src
              elif src.startswith('/'): src='https://m.sohu.com'+src
              elif not src.startswith('http'): continue
              scripts.append(src)
          scripts=list(dict.fromkeys(scripts))

          needles=['FeedSlideloadAuthor','authorColumnId','productId','325','loadMore','InfiniteLoadComp','CONTENTKEY','tplCompKey','dataSource','feedType','XTOPIC_SYNTHETICAL','mkey','cursor','offset','pageSize','pageNum']
          jshits=[]
          for src in scripts:
              if 'Clientindex' not in src and 'dpfe' not in src and 'statics.itc.cn' not in src:
                  continue
              try:
                  _,js=fetch(src)
              except Exception as e:
                  jshits.append({'src':src,'error':repr(e)}); continue
              local=[]
              for needle in needles:
                  pos=0; cnt=0
                  while True:
                      i=js.find(needle,pos)
                      if i<0: break
                      local.append({'needle':needle,'snippet':js[max(0,i-1200):min(len(js),i+2600)]})
                      cnt+=1; pos=i+len(needle)
                      if cnt>=6: break
              # Also enumerate absolute/relative API-looking string literals around m.sohu/cbd/dpfe endpoints.
              urls=sorted(set(re.findall(r'["\']((?:https?:)?//[^"\']+|/[^"\']*(?:api|feed|content|data)[^"\']*)["\']',js)))
              useful_urls=[u for u in urls if any(k in u.lower() for k in ['api','feed','content','cbd','gateway','author'])][:300]
              if local or useful_urls:
                  jshits.append({'src':src,'size':len(js),'hits':local,'urls':useful_urls})

          os.makedirs('tmp-sohu-feed-reverse-result',exist_ok=True)
          with open('tmp-sohu-feed-reverse-result/result.json','w',encoding='utf-8') as f:
              json.dump({'probes':probes,'scripts':scripts,'jshits':jshits},f,ensure_ascii=False,indent=2)
          print(json.dumps({'probes':probes,'script_count':len(scripts),'hit_files':[(x.get('src'),x.get('size'),len(x.get('hits',[])),len(x.get('urls',[]))) for x in jshits]},ensure_ascii=False,indent=2))
          PY
      - name: Persist
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp-sohu-feed-reverse-result
          if ! git diff --cached --quiet; then
            git commit -m 'chore: persist Sohu feed reverse result [skip ci]'
            git pull --rebase origin tmp/zhihu-chen-li-20260824
            git push origin HEAD:tmp/zhihu-chen-li-20260824
          fi
